  bio: >-
    Paul studied mathematics and physics at Denison University and earned his
    PhD in physics at the University of Illinois Urbana-Champaign with David
    Ceperley. After a postdoc at Lawrence Livermore National Laboratory and a
    Flatiron Research Fellowship at the Center for Computational Quantum
    Physics, he joined Hofstra University in 2025. He develops neural-network
    and quantum Monte Carlo methods for strongly interacting electrons.

