  bio: >-
    Paul studied mathematics and physics at Denison University and earned his
    PhD in physics at the University of Illinois Urbana-Champaign with Prof. David
    Ceperley. After postdoctoral work at Lawrence Livermore National Laboratory and
    the Center for Computational Quantum Physics (CCQ) at the Flatiron Institute,
    he joined Hofstra University in Fall of 2024. He develops neural-network
    and quantum Monte Carlo methods to study strongly interacting electrons.

