      - { title: Data visualization showcase, date: 2019-02-06, with: Cail Daley, url: "http://www.thehackerwithin.org/illinois/posts/data-visualization-showcase" }
      - { title: Docker for science, date: 2018-12-05, url: "http://www.thehackerwithin.org/illinois/posts/docker" }
