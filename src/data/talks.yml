series:
  - name: Algorithm Interest Group
    org: University of Illinois Urbana-Champaign
    years: 2016–2020
    url: "http://algorithm-interest-group.com/"
    about: >-
      A weekly meeting founded by physics graduate students at UIUC, where
      one member presents an algorithm and its use in practice.
    talks:
      - { title: Linear sum assignment, date: 2020-10-19, url: "http://algorithm-interest-group.com/algorithm/Linear-Sum-Assignment-Yubo-Paul-Yang/" }
      - { title: Compressive sensing, date: 2019-11-01, url: "http://algorithm-interest-group.com/algorithm/Compressive-Sensing-Yubo-Paul-Yang/" }
      - { title: Kriging (Gaussian process regression), date: 2019-01-17, url: "http://algorithm-interest-group.com/algorithm/Kriging-Yubo-Paul-Yang/" }
      - { title: Meltdown, date: 2018-01-26, url: "http://algorithm-interest-group.com/algorithm/Meltdown-Yubo-Paul-Yang/" }
      - { title: Marching cubes, date: 2017-09-12, url: "http://algorithm-interest-group.com/algorithm/Marching-Cubes-Yubo-Paul-Yang/" }
      - { title: Gibbs sampling, date: 2017-01-24, url: "http://algorithm-interest-group.com/algorithm/Gibbs-Sampling-Yubo-Paul-Yang/" }
      - { title: Particle swarm optimization, date: 2016-09-09, url: "http://algorithm-interest-group.com/algorithm/Particle-Swarm-Optimization-Yubo-Paul-Yang/" }
      - { title: Automatic differentiation, date: 2016-06-01, url: "http://algorithm-interest-group.com/algorithm/Automatic-Differentiation-Yubo-Paul-Yang/" }

  - name: The Hacker Within
